<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi cuenta - Hilitos de Luna</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/panel.css">
</head>

<body>
    <div class="hl-panel-shell">
        <aside class="hl-sidebar" id="sidebarCuenta">
            <div class="hl-sidebar-brand">
                <span class="brand-mark">H</span>
                <span>Hilitos de Luna</span>
            </div>
            <p class="px-2 text-muted small mb-3" id="saludoUsuario">Hola 💗</p>
            <ul class="hl-menu">
                <li><button data-seccion="perfil" class="active"><i class="fas fa-user"></i> Mi perfil</button></li>
                <li><button data-seccion="direcciones"><i class="fas fa-location-dot"></i> Mis direcciones</button></li>
                <li><button data-seccion="pedidos"><i class="fas fa-box"></i> Mis pedidos</button></li>
                <li><button data-seccion="favoritos"><i class="fas fa-heart"></i> Favoritos</button></li>
                <li><button data-seccion="solicitudes"><i class="fas fa-rotate-left"></i> Solicitudes de cambio/devolucion</button></li>
                <li><a href="index.html"><i class="fas fa-shop"></i> Ir a la tienda</a></li>
                <li><button id="btnCerrarSesion" class="hl-menu-danger"><i class="fas fa-right-from-bracket"></i> Cerrar sesion</button></li>
            </ul>
        </aside>

        <main class="hl-content">
            <div class="hl-content-header">
                <button class="hl-sidebar-toggle" id="btnToggleSidebar"><i class="fas fa-bars"></i></button>
                <h1 id="tituloSeccion">Mi perfil</h1>
            </div>

            <!-- PERFIL -->
            <section class="hl-panel-section active" id="seccion-perfil">
                <div class="hl-card">
                    <h2 class="h5 mb-3">Informacion personal</h2>
                    <form id="formPerfil">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Nombre completo</label>
                                <input type="text" class="form-control" id="perfilNombre" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Correo electronico</label>
                                <input type="email" class="form-control" id="perfilCorreo" disabled>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Telefono</label>
                                <input type="tel" class="form-control" id="perfilTelefono" placeholder="300 123 4567">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Direccion predeterminada</label>
                                <select class="form-select" id="perfilDireccionPredeterminada"></select>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-shop mt-4">Guardar cambios</button>
                    </form>
                </div>
            </section>

            <!-- DIRECCIONES -->
            <section class="hl-panel-section" id="seccion-direcciones">
                <div class="hl-card">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2 class="h5 mb-0">Mis direcciones</h2>
                        <button class="btn btn-shop btn-sm" id="btnNuevaDireccion"><i class="fas fa-plus"></i> Agregar</button>
                    </div>
                    <div id="listaDirecciones"></div>
                </div>
            </section>

            <!-- PEDIDOS -->
            <section class="hl-panel-section" id="seccion-pedidos">
                <div class="hl-card">
                    <h2 class="h5 mb-3">Mis pedidos</h2>
                    <div id="listaPedidos"></div>
                </div>
            </section>

            <!-- FAVORITOS -->
            <section class="hl-panel-section" id="seccion-favoritos">
                <div class="hl-card">
                    <h2 class="h5 mb-3">Favoritos</h2>
                    <div id="listaFavoritos" class="row g-3"></div>
                </div>
            </section>

            <!-- SOLICITUDES -->
            <section class="hl-panel-section" id="seccion-solicitudes">
                <div class="hl-card">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2 class="h5 mb-0">Mis solicitudes</h2>
                        <button class="btn btn-shop btn-sm" id="btnNuevaSolicitud"><i class="fas fa-plus"></i> Nueva solicitud</button>
                    </div>
                    <div id="listaSolicitudes"></div>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal direccion -->
    <div class="hl-modal-backdrop" id="modalDireccion">
        <div class="hl-modal">
            <h3 class="h5 mb-3">Direccion</h3>
            <form id="formDireccion">
                <input type="hidden" id="direccionId">
                <div class="hl-field">
                    <label>Ciudad</label>
                    <input type="text" class="form-control" id="direccionCiudad" required>
                </div>
                <div class="hl-field">
                    <label>Departamento / Provincia</label>
                    <input type="text" class="form-control" id="direccionDepartamento" required>
                </div>
                <div class="hl-field">
                    <label>Codigo postal</label>
                    <input type="text" class="form-control" id="direccionCodigoPostal" required>
                </div>
                <div class="hl-field">
                    <label>Direccion</label>
                    <input type="text" class="form-control" id="direccionTexto" required>
                </div>
                <div class="d-flex gap-2 mt-3">
                    <button type="submit" class="btn btn-shop flex-fill">Guardar</button>
                    <button type="button" class="btn btn-outline-dark flex-fill" id="btnCerrarModalDireccion">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal solicitud -->
    <div class="hl-modal-backdrop" id="modalSolicitud">
        <div class="hl-modal">
            <h3 class="h5 mb-3">Nueva solicitud</h3>
            <form id="formSolicitud">
                <div class="hl-field">
                    <label>Pedido</label>
                    <select class="form-select" id="solicitudPedido" required></select>
                </div>
                <div class="hl-field">
                    <label>Tipo de solicitud</label>
                    <select class="form-select" id="solicitudTipo" required>
                        <option value="Cambio">Cambio</option>
                        <option value="Devolucion">Devolucion</option>
                        <option value="Garantia">Garantia</option>
                    </select>
                </div>
                <div class="hl-field">
                    <label>Motivo</label>
                    <select class="form-select" id="solicitudMotivo" required>
                        <option>Producto defectuoso</option>
                        <option>No corresponde al pedido</option>
                        <option>Cambio de talla/color</option>
                        <option>Otro</option>
                    </select>
                </div>
                <div class="hl-field">
                    <label>Descripcion</label>
                    <textarea class="form-control" id="solicitudDescripcion" rows="3" required></textarea>
                </div>
                <div class="hl-field">
                    <label>Fotografias (opcional)</label>
                    <input type="file" class="form-control" id="solicitudFotos" accept="image/*" multiple>
                    <p class="hl-hint">Demostrativo: los archivos no se suben a ningun servidor.</p>
                </div>
                <div class="d-flex gap-2 mt-3">
                    <button type="submit" class="btn btn-shop flex-fill">Enviar solicitud</button>
                    <button type="button" class="btn btn-outline-dark flex-fill" id="btnCerrarModalSolicitud">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/store.js"></script>
    <script src="js/ui-components.js"></script>
    <script src="js/cuenta.js"></script>
</body>

</html>
